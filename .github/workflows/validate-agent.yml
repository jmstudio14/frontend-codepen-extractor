name: Validate agent package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package structure and metadata
        run: node scripts/validate-agent.mjs
      - name: Run smoke tests
        run: node scripts/test-agent.mjs
