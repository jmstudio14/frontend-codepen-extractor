name: Validate agent and plugin package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        # Windows catches line-ending and path issues that contributors on Windows would hit locally.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned validation dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate standalone agent package
        run: node scripts/validate-agent.mjs
      - name: Validate Claude Code plugin and marketplace
        run: node scripts/validate-plugin.mjs
      - name: Syntax-check evaluation scripts
        run: |
          node --check scripts/evaluation/validate-architect-plan.mjs
          node --check scripts/evaluation/check-web-fixture.mjs
          node --check scripts/evaluation/fixtures.mjs
          node --check scripts/evaluation/browser-check.mjs
          node --check scripts/evaluation/manual-eval.mjs
      - name: Run deterministic security gate
        run: node scripts/security-gate.mjs
      - name: Run smoke tests
        run: node scripts/test-agent.mjs
      - name: Run evaluation harness fixture
        run: node scripts/evaluate-agent.mjs --adapter "node tests/fixtures/evaluation-adapter.mjs" --output "${RUNNER_TEMP}/agent-evaluation-smoke.json"
      - name: Run the PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/validate-agent.ps1 -Quiet
      - name: Run the PowerShell wrapper in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/validate-agent.ps1 -Quiet
