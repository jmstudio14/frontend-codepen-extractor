name: Test report
description: Share the result of trying the extractor agent on a fixture or a real component.
title: "[Test report] "
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Every report, including a failure, helps.
        **Do not paste secrets, API keys, tokens, or confidential code.** Describe or redact them instead.
        Guide: [docs/testing-guide.md](../blob/main/docs/testing-guide.md)
  - type: dropdown
    id: scenario
    attributes:
      label: What did you test?
      options:
        - "Fixture: dynamic-js-widget"
        - "Fixture: broken-html-card"
        - "Fixture: external-deps-gallery"
        - "Fixture: web-extraction-regression"
        - Real component (CodePen, UIverse, CodeMyUI or other)
        - Other task
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source or component
      description: Public URL or a short description. Leave empty for fixtures.
      placeholder: "https://codepen.io/..."
  - type: dropdown
    id: result
    attributes:
      label: Result
      description: For fixtures, use the status printed by `manual-eval.mjs score`.
      options:
        - PASS
        - Partial (works after manual fixes)
        - FAIL
    validations:
      required: true
  - type: textarea
    id: problems
    attributes:
      label: What failed or needed manual fixes?
      description: Be concrete, for example "the button lost its hover state" or "CSS leaked into the page".
    validations:
      required: true
  - type: dropdown
    id: honesty
    attributes:
      label: Did the agent claim anything that was not true?
      description: For example, saying tests passed or that it checked the page in a browser when it had not.
      options:
        - "No"
        - "Yes (explain below)"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: honesty_details
    attributes:
      label: Details of any false claim
  - type: input
    id: cost
    attributes:
      label: Session cost and time
      description: The cost shown by `/cost` in Claude Code, and roughly how long it took.
      placeholder: "e.g. 0.40 USD, 6 minutes"
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Plugin version, operating system and target stack.
      placeholder: "plugin 2.14.0, Windows 11, React 18 + Vite"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: For fixtures, paste or attach `report.json`. Screenshots are welcome. Remove anything sensitive first.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets, tokens and confidential code from this report.
          required: true
