<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <article class="card" id="card" aria-labelledby="card-name">
    <img src="avatar.svg" alt="Avatar of Ada Lovelace" width="72" height="72">
    <h2 id="card-name">Ada Lovelace</h2>
    <p class="role">Analyst</p>
    <p class="bio">First programmer, 1843.</p>
    <div class="actions">
      <button type="button" class="follow">Follow</button>
      <button type="button" class="close" aria-label="Close card">x</button>
    </div>
  </article>
  <script src="card.js"></script>
</body>
</html>
